name: Build Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk membuat GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Izinkan gradlew dieksekusi
        run: chmod +x ./gradlew

      # Opsional: kalau secret keystore diisi, APK ditandatangani dengan key sendiri.
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipakai."
          else
            echo "::warning::KEYSTORE_BASE64 belum diisi — APK ditandatangani dengan debug key."
          fi

      - name: Build APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PVERSION_CODE=${{ github.run_number }} --stacktrace

      - name: Ganti nama APK
        id: apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DEST="GameBoostPro-release-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GameBoostPro-release-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
